[package]
name = "dim-providers"
description = "Dosya İnceleme Masası — AI sağlayıcı sözleşmesi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "2.12", features = ["json"] }

# macOS Anahtar Zinciri (F09-T07): anahtar OS güvenli deposunda tutulur.
# Yalnız macOS'ta derlenir; diğer platformlarda `secret::OsStore` açıkça
# `E_AI_SECRET_UNSUPPORTED` döner (sessiz yok sayma yok).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Windows Kimlik Yöneticisi (F09-T07): `keyring` Win32 Credential Manager'ı
# **güvenli** API ile sarar; çalışma alanı `unsafe_code = "forbid"` kapısını
# delmek gerekmez. Yalnız Windows'ta derlenir.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
serial_test = "3"

[lints]
workspace = true

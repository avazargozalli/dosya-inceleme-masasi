[package]
name = "dim-vault"
description = "Dosya İnceleme Masası — şifreli kasa ve blob AEAD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac = "0.12.1"
rand.workspace = true
zeroize.workspace = true
thiserror.workspace = true
data-encoding.workspace = true
subtle.workspace = true
# Devir paketi (`package::seal_dir`) klasörü zip'e koyar. Bağımlılık bilinçli
# olarak burada: paket **biçimi** ve paketin **yazılması** aynı modülde kalır,
# açık metin temizliği çağıranın (masaüstü kabuğu) sorumluluğuna bırakılmaz.
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.14.0"

[lints]
workspace = true

name: desktop-build

# Ağır Tauri derlemesi yalnız elle veya etiketle tetiklenir; her push'ta
# çalıştırılmaz. Paket **imzasızdır**: F16'da Apple notarizasyonu ve Windows
# kod imzası devreye girer. Bu iş artefakt üretir, sürüm yayımlamaz.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dim/desktop build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Belge worker'ını paketle
        run: bash scripts/build-worker.sh
      - name: Paket içinde worker var mı
        run: test -x apps/desktop/src-tauri/resources/worker/dim-worker
      - name: İmzasız .app üret
        run: pnpm --filter @dim/desktop exec tauri build --target ${{ matrix.target }} --bundles app
      - name: Artefaktı sıkıştır
        run: |
          cd "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ditto -c -k --sequesterRsrc --keepParent *.app "$RUNNER_TEMP/dim-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dim-macos-${{ matrix.target }}
          path: ${{ runner.temp }}/dim-${{ matrix.target }}.zip
          if-no-files-found: error

  windows-binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dim/desktop build
      - name: İmzasız MSI üret (kod imzası kapsam dışı — ADR-0012)
        run: pnpm --filter @dim/desktop exec tauri build --bundles msi
      - name: MSI gerçekten üretildi mi
        shell: bash
        run: |
          ls apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        with:
          name: dim-windows-x64
          path: apps/desktop/src-tauri/target/release/*.exe
          if-no-files-found: ignore

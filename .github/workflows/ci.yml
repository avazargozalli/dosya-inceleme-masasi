name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: sözleşmeler (JSON Schema → TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Üretilen tipler güncel mi?
        run: node packages/contracts/scripts/generate.mjs --check
      - name: Şema testleri
        run: node --test packages/contracts/test/*.test.mjs

  web:
    name: arayüz (tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Rust↔Python entegrasyon testleri `dim_worker` modülünü arar. Bağımlılık
      # kurmadan yalnız modül yolunu açar; PDF/OCR motoru isteyen testler yine
      # atlanır (onlar `python` işinde tam bağımlılıkla koşar).
      - name: Belge worker'ı modül yolu
        run: |
          echo "PYTHONPATH=$PWD/workers/document" >> "$GITHUB_ENV"
          PYTHONPATH="$PWD/workers/document" python3 -c "import dim_worker; print('dim_worker:', dim_worker.__file__)"
      - run: cargo test --workspace --all-targets

  desktop:
    name: masaüstü kabuk (clippy + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Tauri biçimi
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Tauri clippy + derleme
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test kapısı öz testi
        run: python3 scripts/desktop_test_gate.py --self-test
      # Bu iş bugüne dek yalnız **derliyordu**: test ikilisi hiç koşmuyordu.
      # Artık `commands_tests.rs` (32) + `parse_pool.rs` (6) gerçekten koşar;
      # 5 test gerçek worker/tesseract ister ve `#[ignore]` taşır. Kapı sayı
      # tabanını ve kaynak sayımını denetler → test sessizce kaybolamaz.
      - name: Masaüstü kabuk testleri (gerçek kasa, worker'sız)
        run: python3 scripts/desktop_test_gate.py

  windows-secret:
    name: windows güvenli depo (cargo test)
    # F09-T07: Windows Kimlik Yöneticisi yolu **yalnız** Windows'ta derlenir;
    # macOS/ubuntu işleri bu modülü hiç görmez. Bu iş gerçek Credential
    # Manager üzerinde yaz→oku→sil tatbikatını koşar.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: clippy (sağlayıcı crate, Windows modülü dahil)
        run: cargo clippy -p dim-providers --all-targets -- -D warnings
      - name: Windows Kimlik Yöneticisi tatbikatı
        run: cargo test -p dim-providers --lib

  python:
    name: belge worker'ı (pytest + duman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract (OCR)
        # `tur` **ürün varsayılanı** (`tur+eng`); kurulmazsa varsayılan OCR
        # dil paketi kapısında `E_OCR_LANG_MISSING` verir ve ürün yolu CI'da
        # hiç denenmemiş olur.
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-tur
      - run: pip install -e "workers/document[all,dev]"
      - run: python -m pytest workers/document/tests -q
      - name: OCR dil ölçüm koşucusu (saf yardımcılar)
        run: python3 scripts/ocr_lang_bench.py --self-test
      - name: Uçtan uca duman testi (gerçek worker + sentetik PDF)
        run: python tests/smoke/worker_smoke.py

  sbom:
    name: SBOM (Rust/Node/Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Malzeme listesi üret
        run: bash scripts/sbom.sh
      - name: SBOM bağlayıcı kapısı (kapsam + sabit sürüm + ürüne bağlama)
        run: |
          python3 scripts/sbom_check.py sbom.json
          python3 scripts/sbom_check.py --self-test
      - name: Üçüncü taraf lisans bildirimi (kapsam + SPDX + SBOM eşleşmesi)
        run: |
          python3 scripts/third_party_notices.py --check --sbom sbom.json
          python3 scripts/third_party_notices.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  kaynak:
    name: kaynak arşivi (AGPL kaynak teslimi)
    # F16-T01'in son maddesi: kaynak etiketi/arşivi. `git archive` hiç
    # çağrılmıyordu → ikili paketle verilecek "buna karşılık gelen kaynak"
    # üretilmiyordu. Bu iş her push'ta gerçek repodan arşiv üretir, bağımsız
    # doğrular ve indirilebilir artifact olarak bırakır. Yayın anında aynı
    # araç `--tag` ile etiket bağını ve `--sbom` ile SBOM subject'ini zorunlu
    # kılar (aşağıdaki belge).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kapı kendini sınar (sürüm/etiket/kilit/sır mutasyonları)
        run: python3 scripts/source_release.py --self-test
      - name: Kaynak arşivi üret ve bağımsız doğrula
        run: |
          python3 scripts/source_release.py build --ref HEAD --out "$RUNNER_TEMP/kaynak" --allow-untagged
          python3 scripts/source_release.py check "$RUNNER_TEMP/kaynak"/*.tar.gz
          ls -l "$RUNNER_TEMP/kaynak"
      - uses: actions/upload-artifact@v4
        with:
          name: kaynak-arsivi
          path: ${{ runner.temp }}/kaynak
          if-no-files-found: error

  paket:
    name: sürüm paketi manifesti (F16-T05/T09)
    # İkili paketler depoda tutulmaz (elle, **imzasız** üretilir); bu iş
    # manifest biçimini, zorunlu platform kümesini ve indirme doğrulamasını
    # gerçek ürün adı/sürümüyle sınar. Artefaktlar **sentetiktir** ve üretilen
    # manifest `release-manifest.ornek.json` adını taşır — gerçek sürüm
    # manifesti sanılmamalıdır.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kapı kendini sınar (ad/sürüm/zorunlu/imza/kaynak kapıları)
        run: python3 scripts/release_manifest.py --self-test
      - name: Kaynak bağı + paket manifesti (sentetik artefaktlar)
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/paket"
          mkdir -p "$WORK/artifacts"
          python3 scripts/source_release.py build --ref HEAD --out "$WORK/kaynak" --allow-untagged
          python3 - "$WORK/artifacts" <<'PY'
          import json, pathlib, sys
          art = pathlib.Path(sys.argv[1])
          conf = json.loads(pathlib.Path("apps/desktop/src-tauri/tauri.conf.json").read_text())
          product, version = conf["productName"], conf["version"]
          for name, body in [
              (f"{product}_{version}_aarch64.dmg", b"sentetik-macos-arm64"),
              (f"{product}_{version}_x64.dmg", b"sentetik-macos-x64"),
              (f"{product}_{version}_x64_tr-TR.msi", b"sentetik-windows-x64"),
          ]:
              (art / name).write_bytes((body * 512)[:4096])
          PY
          VERSION="$(python3 -c 'import json;print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          python3 scripts/release_manifest.py build \
            --artifacts "$WORK/artifacts" \
            --version "$VERSION" \
            --commit "$(git rev-parse HEAD)" \
            --source-manifest "$WORK"/kaynak/*.manifest.json \
            --out "$WORK/release-manifest.ornek.json"
          for file in "$WORK"/artifacts/*; do
            python3 scripts/release_manifest.py verify \
              --manifest "$WORK/release-manifest.ornek.json" --file "$file" --version "$VERSION"
          done
      - name: Kesilen ve kurcalanmış paket reddedilir
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/paket"
          MSI="$(ls "$WORK"/artifacts/*.msi)"
          mkdir -p "$WORK/kesik" "$WORK/kurcali"
          # Aynı **ad**, eksik bayt: indirme kesilmiş sayılır (E_SIZE).
          head -c 100 "$MSI" > "$WORK/kesik/$(basename "$MSI")"
          # Aynı ad, aynı boyut, değişmiş bayt: kurcalama sayılır (E_HASH).
          cp "$MSI" "$WORK/kurcali/$(basename "$MSI")"
          printf 'x' | dd of="$WORK/kurcali/$(basename "$MSI")" bs=1 seek=0 conv=notrunc status=none
          for case in kesik:E_SIZE kurcali:E_HASH; do
            dir="${case%%:*}"; code="${case##*:}"
            if python3 scripts/release_manifest.py verify \
                 --manifest "$WORK/release-manifest.ornek.json" \
                 --file "$WORK/$dir/$(basename "$MSI")" 2>"$WORK/$dir.log"; then
              echo "KIRMIZI: $dir paketi kabul edildi"; exit 1
            fi
            grep -q "$code" "$WORK/$dir.log" || { echo "KIRMIZI: $dir için $code beklenirdi"; cat "$WORK/$dir.log"; exit 1; }
            echo "ok: $dir → $code"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: paket-manifesti
          path: ${{ runner.temp }}/paket/release-manifest.ornek.json
          if-no-files-found: error

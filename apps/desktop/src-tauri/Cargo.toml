[package]
name = "dim-desktop"
version = "0.1.0"
description = "Dosya İnceleme Masası masaüstü kabuğu"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "dim_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
dim-vault = { path = "../../../crates/vault" }
dim-storage = { path = "../../../crates/storage" }
dim-ingest = { path = "../../../crates/ingest" }
dim-cli-adapters = { path = "../../../crates/cli-adapters" }
tauri-plugin-dialog = "2.0.1"
sha2 = "0.10.8"
hex = "0.4.3"
time = { version = "0.3.37", features = ["formatting"] }
zeroize = { version = "1.8.1", features = ["derive"] }

# Masaüstü kabuğu ana çalışma alanının üyesi değildir: Tauri derlemesi
# crates/* test döngüsünü yavaşlatmasın. Ortak crate'ler path ile bağlanır.
[workspace]

[lints.rust]
unsafe_code = "forbid"
